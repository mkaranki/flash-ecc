CONFIG_ZTEST=y
CONFIG_FLASH=y
CONFIG_FLASH_ECC_SHIM=y
CONFIG_STATS_NAMES=y

# Real NOR flash allows further 1 -> 0 writes over already-programmed bits
# without an erase in between - that's exactly what bit-corruption injection
# needs. The simulator's default "double write" protection rejects any write
# to a non-blank region outright, which would break every injection in this
# test.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
