name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (native_sim)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: flash-ecc
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: flash-ecc
          ccache-cache-key: ubuntu-22.04

      - name: Run tests
        working-directory: flash-ecc
        run: west twister -T tests -v --inline-logs --integration
